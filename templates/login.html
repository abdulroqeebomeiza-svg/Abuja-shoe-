<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login - BO YII</title>
<style>
body{margin:0;background:#5D2A42;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
.box{background:white;padding:30px;border-radius:16px;width:90%;max-width:350px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:12px;background:#FF6B35;color:white;border:none;border-radius:30px;font-weight:bold;margin-top:10px}
.error{background:#ffe0e0;color:#a00;padding:10px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
<h2>BO YII Admin</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for cat, msg in messages %}
<div class="error">{{msg}}</div>
{% endfor %}
{% endif %}
{% endwith %}
<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
